name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and prepare notes
        id: metadata
        run: python3 .github/scripts/release_notes.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.is_prerelease }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/job-release-notes.md" --verify-tag)
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          fi

          # Existing releases are never edited or deleted by this workflow.
          # A repeated publication fails visibly; inspect it before retrying.
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
